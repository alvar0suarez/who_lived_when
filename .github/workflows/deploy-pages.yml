name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/interactive-historical-webpage-gu8v7t"]
  workflow_dispatch:

# Permisos que necesita la acción oficial de Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; cancela los anteriores en curso
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Activa GitHub Pages automáticamente si aún no lo está
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # El sitio es estático y vive en la raíz del repo
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
